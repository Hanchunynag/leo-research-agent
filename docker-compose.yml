services:
  reverse-proxy:
    build:
      context: ./deploy
      dockerfile: Dockerfile.reverse-proxy
    ports:
      - "${LEO_HTTP_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  scholar-proxy:
    build:
      context: ./deploy
      dockerfile: Dockerfile.scholar-proxy
    ports:
      - "${LEO_SCHOLAR_HTTP_PORT:-8001}:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped

  api:
    image: leo-research-agent-complete:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ORCHESTRATION_BACKEND: crewai
      LEO_AGENTIC_RUNTIME_MODE: production
      # The application and every parser runtime are baked into the image.
      # Only persistent application data is mounted below as Docker-managed
      # volumes; the host source tree is never used at runtime.
      LEO_PROJECT_ROOT: /app
      # Preserve project identity if an existing .scholar volume was created
      # by the previous /app/workspace deployment.
      LEO_PROJECT_ROOT_ALIASES: /app/workspace
      # These interpreters are part of the image. Never resolve parsing
      # fallbacks from the mounted host workspace or its macOS virtualenvs.
      LEO_MINERU_EXECUTABLE: /opt/mineru/bin/mineru
      LEO_PADDLEOCR_EXECUTABLE: /opt/paddleocr/bin/python
      LEO_AGENTIC_SCHOLAR_CHECKPOINT_PATH: data/runtime/scholar/checkpoint.sqlite
      LEO_SCHOLAR_RESEARCH_MAX_CONCURRENCY: ${LEO_SCHOLAR_RESEARCH_MAX_CONCURRENCY:-1}
      LEO_MYSQL_ENABLED: "true"
      # The host .env may contain 127.0.0.1 for local CLI use.  Containers
      # must always address the Compose database service by its DNS name.
      LEO_MYSQL_URL: mysql+pymysql://leo:${MYSQL_PASSWORD:-change-me}@database:3306/leo_research
      LEO_LLM_BASE_URL: ${LEO_LLM_BASE_URL:?set LEO_LLM_BASE_URL in .env}
      LEO_LLM_MODEL: ${LEO_LLM_MODEL:?set LEO_LLM_MODEL in .env}
      LEO_LLM_API_KEY: ${LEO_LLM_API_KEY:-}
      LEO_LLM_AUTH_SCHEME: ${LEO_LLM_AUTH_SCHEME:-bearer}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - leo_data:/app/data
      - leo_scholar:/app/.scholar
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: leo-research-agent-complete:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: [".venv/bin/python", "-m", "scripts.run_scholar_worker"]
    environment:
      ORCHESTRATION_BACKEND: crewai
      LEO_AGENTIC_RUNTIME_MODE: production
      LEO_PROJECT_ROOT: /app
      LEO_PROJECT_ROOT_ALIASES: /app/workspace
      # Keep the worker on the same image-owned Linux parsing runtimes as API.
      LEO_MINERU_EXECUTABLE: /opt/mineru/bin/mineru
      LEO_PADDLEOCR_EXECUTABLE: /opt/paddleocr/bin/python
      LEO_AGENTIC_SCHOLAR_CHECKPOINT_PATH: data/runtime/scholar/checkpoint.sqlite
      LEO_SCHOLAR_RESEARCH_MAX_CONCURRENCY: ${LEO_SCHOLAR_RESEARCH_MAX_CONCURRENCY:-1}
      LEO_MYSQL_ENABLED: "true"
      # Keep the Worker on the same in-network MySQL endpoint as the API;
      # never propagate a host-loopback URL from .env into a container.
      LEO_MYSQL_URL: mysql+pymysql://leo:${MYSQL_PASSWORD:-change-me}@database:3306/leo_research
      LEO_LLM_BASE_URL: ${LEO_LLM_BASE_URL:?set LEO_LLM_BASE_URL in .env}
      LEO_LLM_MODEL: ${LEO_LLM_MODEL:?set LEO_LLM_MODEL in .env}
      LEO_LLM_API_KEY: ${LEO_LLM_API_KEY:-}
      LEO_LLM_AUTH_SCHEME: ${LEO_LLM_AUTH_SCHEME:-bearer}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - leo_data:/app/data
      - leo_scholar:/app/.scholar
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leo_research
      MYSQL_USER: leo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant is a minimal image and does not ship wget/curl.
      # Its PID 1 is the Qdrant server, so this healthcheck has no extra
      # runtime dependency and works on both amd64 and arm64 images.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  leo_data:
  leo_scholar:
  redis_data:
  mysql_data:
  qdrant_data:

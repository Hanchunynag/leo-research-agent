[project]
name = "leo-research-agent"
version = "0.2.0"
description = "Local paper parsing and RAG knowledge base for LEO signals-of-opportunity research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "filelock>=3.20.0",
    "gradio==5.49.1",
    "httpx>=0.28.1",
    "mcp>=1.26,<2",
    "orjson>=3.11.9",
    "pydantic==2.11.10",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "pymupdf>=1.28.0",
    "qdrant-client>=1.15,<2",
    "ragas==0.3.9",
    "rapidfuzz==3.14.3",
    "rich>=13.9,<15",
    "sentence-transformers==3.4.1",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "typer>=0.27.0",
    "uvicorn>=0.35,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "deepagents>=0.7,<1",
    "bibtexparser>=1.4,<2",
    "crewai==1.15.21",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["qdrant: exercises local or remote Qdrant integration"]

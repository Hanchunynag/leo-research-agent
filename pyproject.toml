[project]
name = "leo-research-agent"
version = "0.2.0"
description = "Local paper parsing and RAG knowledge base for LEO signals-of-opportunity research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.20.0",
    "gradio>=6.20.0",
    "httpx>=0.28.1",
    "mcp>=1.26,<2",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "qdrant-client>=1.15,<2",
    "rich>=15.0.0",
    "sentence-transformers>=5,<6",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]

name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Run Ruff
        run: uv run --no-sync ruff check app main.py tests

      - name: Run MyPy
        run: uv run --no-sync mypy app main.py

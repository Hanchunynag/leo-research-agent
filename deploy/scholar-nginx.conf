events {}

http {
  upstream frontend_upstream { server frontend:80; }
  upstream api_upstream { server api:8000; }

  server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 200m;
    client_body_timeout 3600s;

    # The dedicated Scholar port has its own root entry point.  The pathname
    # is preserved so the SPA selects ScholarConsole instead of LegacyApp.
    location = / {
      return 302 /scholar;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }

    location = /health { proxy_pass http://api_upstream; }
    location = /ready { proxy_pass http://api_upstream; }
    location / { proxy_pass http://frontend_upstream; }
  }
}
